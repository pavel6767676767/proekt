services:
  backend:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      - shop_data:/app/data
      - ./backend/static:/app/static:ro
    environment:
      DATABASE_URL: sqlite:////app/data/shop.db
    expose: ["8000"]
    restart: unless-stopped
  frontend:
    build: ./frontend
    expose: ["80"]
    restart: unless-stopped
    depends_on: [backend]
  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [backend, frontend]
    restart: unless-stopped
volumes:
  shop_data:
